name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/build-ios-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Compile for iOS Simulator
        working-directory: ios
        run: >-
          xcodebuild
          -project PlusKosen.xcodeproj
          -scheme PlusKosen
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath simulator-build
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Capture Simulator preview
        working-directory: ios
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | contains("iPhone"))][0].udid')"
          test -n "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP_PATH="$(find simulator-build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.webclass.plus.ios --args -ui-preview
          sleep 3
          mkdir -p preview-artifacts
          xcrun simctl io "$DEVICE_ID" screenshot preview-artifacts/home.png
      - name: Upload Simulator preview
        uses: actions/upload-artifact@v4
        with:
          name: PlusKosen-iOS-preview
          path: ios/preview-artifacts/home.png
          if-no-files-found: error
      - name: Build unsigned device app
        working-directory: ios
        run: >-
          xcodebuild
          -project PlusKosen.xcodeproj
          -scheme PlusKosen
          -configuration Release
          -sdk iphoneos
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          build
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload PlusKosen-unsigned.ipa
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: PlusKosen-unsigned-4.5.2-31
          path: ios/PlusKosen-unsigned.ipa
          if-no-files-found: error

