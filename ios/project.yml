name: PlusKosen
options:
  bundleIdPrefix: com.webclass
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "4.5.2"
    CURRENT_PROJECT_VERSION: "31"
targets:
  PlusKosen:
    type: application
    platform: iOS
    sources:
      - path: PlusKosen
    info:
      path: PlusKosen/Info.plist
      properties:
        CFBundleDisplayName: 高専プラス
        UILaunchScreen: {}
        NSCameraUsageDescription: 無音カメラで写真を撮影するためにカメラを使用します。
        NSPhotoLibraryAddUsageDescription: 撮影した写真を保存するために写真ライブラリを使用します。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.webclass.plus.ios
        PRODUCT_NAME: PlusKosen
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []

